<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 생생세특 (Live Seteuk) - 라이브 구글 시트 에디터</title>
    <!-- 캐시 방지 헤더 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
        }
        .sheet-grid th, .sheet-grid td {
            border: 1px solid #cbd5e1;
            white-space: nowrap;
        }
        .tab-active {
            background-color: #ffffff !important;
            color: #4f46e5 !important;
            font-weight: 800 !important;
            border-bottom: 3px solid #4f46e5 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden">

    <!-- 상단 헤더 툴바 -->
    <header class="bg-indigo-900 text-white px-4 py-2.5 flex items-center justify-between shadow-md z-30 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-500 rounded-xl flex items-center justify-center font-bold text-white shadow-inner">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-tight flex items-center gap-2">
                    <span>모바일 생생세특 - 구글 시트 라이브 에디터</span>
                    <span class="px-2 py-0.5 bg-emerald-500/30 text-emerald-300 border border-emerald-400/40 rounded-full text-[10px] font-bold">
                        구글 서버 백엔드 연동됨
                    </span>
                </h1>
                <p class="text-[11px] text-indigo-200">구글 드라이브 PropertiesService 서버 암호화 금고 및 7대 탭 데이터 동기화</p>
            </div>
        </div>

        <!-- 툴바 컨트롤 버튼 모음 -->
        <div class="flex items-center gap-2">
            <button onclick="openApiModal()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm">
                <i data-lucide="key" class="w-3.5 h-3.5 text-amber-300"></i> API 보안 설정
            </button>
            <button onclick="setupSheets()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-indigo-300"></i> 7대 탭 리셋
            </button>
            <button onclick="loadLiveDataFromGoogle()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 동기화 새로고침
            </button>
        </div>
    </header>

    <!-- 수식 및 셀 정보 입력 바 -->
    <div class="bg-white border-b border-slate-200 px-4 py-1.5 flex items-center gap-3 text-xs shrink-0 shadow-inner">
        <span id="activeCellPos" class="font-mono font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100 min-w-[40px] text-center">A1</span>
        <span class="text-slate-400 font-bold">fx</span>
        <input type="text" id="formulaInput" oninput="updateActiveCellValue()" placeholder="셀 내용 입력..." class="flex-1 px-2 py-1 bg-slate-50 border border-slate-200 rounded outline-none focus:border-indigo-500 text-xs font-medium">
    </div>

    <!-- 7대 시트 탭 이동 바 -->
    <div class="bg-slate-100 border-b border-slate-200 px-2 flex items-center gap-1 overflow-x-auto scrollbar-none text-xs font-semibold text-slate-600 shrink-0" id="tabBar">
    </div>

    <!-- 메인 시트 그리드 테이블 영역 -->
    <div class="flex-1 overflow-auto bg-slate-200 p-2 relative" id="gridContainer">
        <div class="bg-white rounded-lg shadow-sm border border-slate-300 overflow-hidden inline-block min-w-full">
            <table class="sheet-grid w-full text-xs" id="sheetTable">
            </table>
        </div>
    </div>

    <!-- 하단 상태 바 -->
    <footer class="bg-white border-t border-slate-200 px-4 py-1.5 flex items-center justify-between text-[11px] text-slate-500 shrink-0">
        <span id="statusMessage">🟢 구글 서버 라이브 연결 상태: 정상 (7대 탭 지원)</span>
        <span id="rowCountInfo" class="font-mono">총 0개 행</span>
    </footer>

    <!-- API 설정 모달 (PropertiesService 연동) -->
    <div id="apiModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-200 animate-fade-in">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-base font-black text-slate-800 flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-5 h-5 text-indigo-600"></i>
                    <span>PropertiesService API 보안 설정</span>
                </h3>
                <button onclick="closeApiModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <p class="text-xs text-slate-500 leading-relaxed">
                입력하신 API 키는 구글 서버의 **PropertiesService 암호화 금고**에 안전하게 저장되며 시트에 노출되지 않습니다.
            </p>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-bold text-slate-700">1. Upstage Solar API Key</label>
                    <input type="password" id="modalUpstageKey" placeholder="Upstage API Key 입력" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-mono">
                </div>
                <div>
                    <label class="font-bold text-slate-700">2. Google Gemini API Key (추천)</label>
                    <input type="password" id="modalGeminiKey" placeholder="Google Gemini API Key 입력" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-mono">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-slate-700">3. 기본 AI 모델</label>
                        <select id="modalAISelect" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold">
                            <option value="Gemini">Gemini (추천)</option>
                            <option value="Upstage">Upstage Solar</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-700">4. 목표 바이트</label>
                        <select id="modalTargetBytes" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold">
                            <option value="500">500 Bytes</option>
                            <option value="750">750 Bytes</option>
                            <option value="1000">1000 Bytes</option>
                            <option value="1500" selected>1500 Bytes</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="font-bold text-slate-700">5. 담당 과목명</label>
                    <input type="text" id="modalSubject" value="국어" placeholder="담당 과목 입력" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                </div>
                <div>
                    <label class="font-bold text-slate-700">6. 2022 개정 교과역량</label>
                    <input type="text" id="modalCompetencies" value="비판적 사고력, 지식정보처리 역량, 공동체·인성 역량" placeholder="강조 역량 입력" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2">
                <button onclick="closeApiModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs hover:bg-slate-200">취소</button>
                <button onclick="saveApiKeys()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs hover:bg-indigo-500 shadow-md">구글 서버 안전 저장</button>
            </div>
        </div>
    </div>

    <script>
        // 7대 탭 양식 통일 (세특템플릿 포함)
        const TABS = ['시간대별기록', '학생명렬', '세특템플릿', '학생응답기록', '세특초안생성', '학생별모아보기', 'API설정'];
        let currentTab = '시간대별기록';
        let sheetStore = {};
        let activeRow = 0;
        let activeCol = 0;

        // 개발/목업 테스트 fallback
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
            window.google = {
                script: {
                    run: {
                        withSuccessHandler: function(cb) { this._success = cb; return this; },
                        withFailureHandler: function(cb) { this._failure = cb; return this; },
                        getDashboardFullData: function() {
                            var self = this;
                            setTimeout(function() {
                                if (self._success) {
                                    self._success({
                                        success: true,
                                        config: { subjectName: '국어', subjectCompetencies: '비판적 사고력, 지식정보처리 역량', targetBytes: '1500' },
                                        students: [{ classNum: 1, number: 1, hakbun: '30101', name: '강해린' }],
                                        observations: [{ date: '2026-08-03 09:30', classNum: 1, category: '교과', hakbun: '30101', name: '강해린', rawMemo: '오발탄 발표 잘함', refinedText: '소설 변용 발표를 주도함' }],
                                        responses: [],
                                        reports: []
                                    });
                                }
                            }, 400);
                        },
                        setApiKeysViaWeb: function() {
                            var self = this;
                            setTimeout(function() {
                                if (self._success) self._success({ success: true, message: '안전하게 저장되었습니다.' });
                            }, 300);
                        },
                        setupInitialSheets: function() {
                            var self = this;
                            setTimeout(function() {
                                if (self._success) alert('✅ 7대 탭 양식 세팅이 완료되었습니다!');
                            }, 300);
                        }
                    }
                }
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            loadLiveDataFromGoogle();
        });

        function renderTabs() {
            const bar = document.getElementById('tabBar');
            let html = '';
            TABS.forEach(tab => {
                const active = (tab === currentTab) ? 'tab-active' : 'hover:bg-slate-200/60';
                html += `<button onclick="switchTab('${tab}')" class="px-3.5 py-2.5 rounded-t-lg transition-all ${active}">${tab}</button>`;
            });
            bar.innerHTML = html;
        }

        function switchTab(tabName) {
            currentTab = tabName;
            renderTabs();
            renderTable();
        }

        // 백엔드 구글 시트 실제 데이터 동기화 함수 (google.script.run 연동)
        function loadLiveDataFromGoogle() {
            document.getElementById('statusMessage').innerHTML = `🔄 구글 라이브 서버에서 7대 탭 동기화 데이터를 가져오는 중...`;
            
            google.script.run
                .withSuccessHandler(function(data) {
                    if (data && data.success) {
                        formatServerDataToStore(data);
                        renderTable();
                        document.getElementById('statusMessage').innerHTML = `🟢 구글 라이브 서버 실시간 동기화 상태: 정상 (7대 탭 지원)`;
                    } else {
                        document.getElementById('statusMessage').innerHTML = `⚠️ 서버 동기화 실패: ${data ? data.message : '알 수 없음'}`;
                    }
                })
                .withFailureHandler(function(err) {
                    document.getElementById('statusMessage').innerHTML = `❌ 서버 통신 오류: ${err.message || err}`;
                })
                .getDashboardFullData('all');
        }

        function formatServerDataToStore(data) {
            sheetStore = {};

            // 1. 시간대별기록
            sheetStore['시간대별기록'] = [
                ['일시', '반', '영역', '학번', '이름', '거친음성/메모', 'AI정돈관찰문장']
            ];
            (data.observations || []).forEach(o => {
                sheetStore['시간대별기록'].push([o.date, o.classNum, o.category, o.hakbun, o.name, o.rawMemo, o.refinedText]);
            });

            // 2. 학생명렬
            sheetStore['학생명렬'] = [
                ['반', '번호', '학번', '이름']
            ];
            (data.students || []).forEach(s => {
                sheetStore['학생명렬'].push([s.classNum, s.number, s.hakbun, s.name]);
            });

            // 3. 세특템플릿
            sheetStore['세특템플릿'] = [
                ['템플릿 구분 / 강조 항목', '교사 맞춤 작성 지침 / 템플릿 내용'],
                ['기본 세특 프롬프트 스타일', '2022 개정 교과역량을 구체적 탐구 사례와 함께 서술하고, 문장은 ~함., ~임. 어조로 마무리할 것.'],
                ['수업 및 세특 강조 사항', '수업 참여 태도, 모둠 내 협력적 의사소통, 자기주도적 문제해결 과정이 잘 드러나도록 작성할 것.'],
                ['생기부 금지어 수칙', '대회, 수상, 대학명, 기관명, 사교육, 도서 출간 사실 등 생기부 기재 금지어를 절대 포함하지 말 것.']
            ];

            // 4. 학생응답기록
            sheetStore['학생응답기록'] = [
                ['일시', '반', '학번', '이름', '응답/제출내용', '구분']
            ];
            (data.responses || []).forEach(r => {
                sheetStore['학생응답기록'].push([r.date, r.classNum, r.hakbun, r.name, r.content, r.type]);
            });

            // 5. 세특초안생성
            sheetStore['세특초안생성'] = [
                ['반', '학번', '이름', '생성 일시', 'NEIS 바이트 수', 'AI 최종 세특/행특 초안']
            ];
            (data.reports || []).forEach(rp => {
                sheetStore['세특초안생성'].push([rp.classNum, rp.hakbun, rp.name, rp.date, rp.bytes, rp.reportText]);
            });

            // 6. 학생별모아보기
            sheetStore['학생별모아보기'] = [
                ['학번', '이름', '누적건수', '누적관찰내용']
            ];

            // 7. API설정
            const cfg = data.config || {};
            sheetStore['API설정'] = [
                ['보안 및 교과역량 설정 항목', '설정 및 상태'],
                ['보안 API 키 저장 방식', 'PropertiesService (구글 서버 암호화 금고)'],
                ['담당 교과명', cfg.subjectName || '국어'],
                ['2022 개정교육과정 핵심역량', cfg.subjectCompetencies || '비판적 사고력, 지식정보처리 역량'],
                ['NEIS 세특 목표 바이트', (cfg.targetBytes || '1500') + ' Bytes'],
                ['AI 모델 선택', 'Gemini (gemini-1.5-flash)']
            ];
        }

        function renderTable() {
            const table = document.getElementById('sheetTable');
            const data = sheetStore[currentTab] || [];
            if (data.length === 0) {
                table.innerHTML = '<tbody><tr><td class="p-8 text-center text-slate-400">데이터가 없습니다.</td></tr></tbody>';
                return;
            }

            let html = '<thead><tr class="bg-slate-100 text-slate-600 font-bold text-[11px] select-none"><th class="w-10 text-center bg-slate-200/80">#</th>';
            
            // 헤더 렌더링
            const headers = data[0] || [];
            headers.forEach((h, colIdx) => {
                html += `<th class="px-3 py-2 text-left font-bold border-r border-slate-300">${escapeHtml(h)}</th>`;
            });
            html += '</tr></thead><tbody>';

            // 데이터 행 렌더링
            for (let r = 1; r < data.length; r++) {
                html += `<tr class="hover:bg-indigo-50/40 transition-colors"><td class="text-center bg-slate-100 font-mono text-[10px] text-slate-400 select-none">${r}</td>`;
                const row = data[r];
                for (let c = 0; c < headers.length; c++) {
                    const val = row[c] !== undefined ? row[c] : '';
                    html += `<td contenteditable="true" onfocus="setActiveCell(${r}, ${c})" onblur="onCellBlur(${r}, ${c}, this)" onkeydown="handleCellKeyDown(event, ${r}, ${c})" class="px-3 py-2 text-slate-800 font-medium outline-none focus:bg-indigo-100/80 focus:ring-2 focus:ring-indigo-500/80 transition-all">${escapeHtml(val)}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody>';
            table.innerHTML = html;
            document.getElementById('rowCountInfo').innerText = `총 ${data.length - 1}개 행 (7대 탭 연동)`;
            lucide.createIcons();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function setActiveCell(r, c) {
            activeRow = r;
            activeCol = c;
            const data = sheetStore[currentTab] || [];
            const colName = String.fromCharCode(65 + c);
            document.getElementById('activeCellPos').innerText = `${colName}${r}`;
            document.getElementById('formulaInput').value = (data[r] && data[r][c] !== undefined) ? data[r][c] : '';
        }

        function updateActiveCellValue() {
            const val = document.getElementById('formulaInput').value;
            if (sheetStore[currentTab] && sheetStore[currentTab][activeRow]) {
                sheetStore[currentTab][activeRow][activeCol] = val;
                const table = document.getElementById('sheetTable');
                if (table.rows[activeRow] && table.rows[activeRow].cells[activeCol + 1]) {
                    table.rows[activeRow].cells[activeCol + 1].innerText = val;
                }
            }
        }

        function onCellBlur(r, c, el) {
            if (sheetStore[currentTab] && sheetStore[currentTab][r]) {
                sheetStore[currentTab][r][c] = el.innerText.trim();
            }
        }

        function handleCellKeyDown(e, r, c) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const table = document.getElementById('sheetTable');
                if (table.rows[r + 1] && table.rows[r + 1].cells[c + 1]) {
                    table.rows[r + 1].cells[c + 1].focus();
                }
            }
        }

        // 백엔드 구글 시트 7대 탭 초기화 함수
        function setupSheets() {
            if (!confirm('구글 시트의 7대 탭 양식을 초기 세팅 상태로 리셋할까요?')) return;
            google.script.run
                .withSuccessHandler(function() {
                    alert('✅ 7대 탭 양식이 성공적으로 리셋되었습니다!');
                    loadLiveDataFromGoogle();
                })
                .setupInitialSheets();
        }

        // PropertiesService 암호화 금고 실시간 저장 연동
        function saveApiKeys() {
            const upstage = document.getElementById('modalUpstageKey').value.trim();
            const gemini = document.getElementById('modalGeminiKey').value.trim();
            const selectedAI = document.getElementById('modalAISelect').value;
            const bytes = document.getElementById('modalTargetBytes').value;
            const subject = document.getElementById('modalSubject').value.trim();
            const comp = document.getElementById('modalCompetencies').value.trim();

            google.script.run
                .withSuccessHandler(function(res) {
                    if (res && res.success) {
                        alert('🎉 모든 API 키와 2022 교과역량 설정이 구글 서버 암호화 금고(PropertiesService)에 안전하게 저장되었습니다!');
                        closeApiModal();
                        loadLiveDataFromGoogle();
                    } else {
                        alert('오류: ' + (res ? res.message : '저장 실패'));
                    }
                })
                .withFailureHandler(function(err) {
                    alert('서버 저장 실패: ' + (err.message || err));
                })
                .setApiKeysViaWeb(upstage, gemini, selectedAI, subject, comp, bytes);
        }

        function openApiModal() {
            document.getElementById('apiModal').classList.remove('hidden');
        }

        function closeApiModal() {
            document.getElementById('apiModal').classList.add('hidden');
        }
    </script>
</body>
</html>
