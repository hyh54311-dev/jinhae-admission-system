name: ✈️ Taiwan Flight Price Tracker Bot

on:
  schedule:
    # 매일 아침 08:30 KST (UTC 23:30) & 오후 16:30 KST (UTC 07:30)
    - cron: '30 23 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 1클릭 실행

jobs:
  track-flight-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Run Flight Price Tracker Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || '8407908239:AAHO81Ld-mmtJ-V5opl5vXI3bXgICiDrNgc' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8518409134' }}
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
        run: |
          python flight_tracker_bot.py
